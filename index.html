<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Jujishou测试</title>
<link rel="stylesheet" href="style.css?v=6bdc41ac94">
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <h2 class="gate-title">Jujishou 内测</h2>
    <p class="gate-sub" id="gateSub">注册一个账号就能进来，不用任何密钥</p>

    <div class="gate-tabs">
      <button class="on" id="gTabReg">注册</button>
      <button id="gTabLogin">已有账号</button>
    </div>

    <div class="gate-form" id="gRegForm">
      <label>用户名
        <input id="gRegName" placeholder="2~32 位，中文也行" autocomplete="username" spellcheck="false">
      </label>
      <label>密码
        <input id="gRegPass" type="password" placeholder="至少 6 位" autocomplete="new-password">
      </label>
      <button class="btn primary" id="gRegGo"><b>注册并开始</b></button>
      <p class="gate-tip">不用邀请码，起个名字设个密码就能玩。注册之后这台设备一年内不用再登录。</p>
    </div>

    <div class="gate-form" id="gLoginForm" hidden>
      <label>用户名
        <input id="gLogName" autocomplete="username" spellcheck="false">
      </label>
      <label>密码
        <input id="gLogPass" type="password" autocomplete="current-password">
      </label>
      <button class="btn primary" id="gLogGo"><b>登录</b></button>
      <p class="gate-tip">已经注册过的号，换设备登录不需要密钥。</p>
    </div>

    <p class="gate-msg" id="gMsg"></p>
  </div>
</div>

<div class="sky" id="sky"></div>
<div class="flash" id="flash"></div>
<div class="flash ur" id="flashUR"></div>

<header>
  <h1>Jujishou测试</h1>
  <p class="sub">抽卡模拟器</p>
</header>

<main>
  <nav class="tabs" id="tabs"></nav>

  <section class="banner">
    <div class="rates" id="rates"></div>
    <div class="pity">
      <div class="pity-text">
        <span id="pityName">大隐藏保底</span>
        <span id="pityLabel">0 / 120</span>
      </div>
      <div class="pity-bar"><i id="pityFill"></i></div>
      <div class="pity-text small" id="pity4Row">
        <span>十连保底 SR</span>
        <span id="pity4Label">0 / 10</span>
      </div>
    </div>
  </section>

  <section class="stage" id="stage">
    <p class="hint">选择卡池，点击下方按钮开始抽卡 ✦</p>
  </section>

  <section class="controls">
    <button class="btn primary" id="pull1"><b>单抽</b><small>×1</small></button>
    <button class="btn gold" id="pull10"><b>十连</b><small>×10</small></button>
  </section>

  <section class="stats" id="stats"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>本池卡面</h2>
      <span class="tiny" id="galleryNote"></span>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>抽卡记录</h2>
      <div class="panel-actions">
        <button class="mini" id="muteBtn" title="音效开关">🔊</button>
        <button class="mini danger" id="resetBtn">重置</button>
      </div>
    </div>
    <ul class="log" id="log"></ul>
  </section>
</main>

<footer>
  <span id="footNote">本地存档 · 刷新不丢 · 仅供娱乐，无任何真实消费</span>
  <span class="who" id="who" hidden></span>
  <button class="mini" id="adminBtn">后台</button>
</footer>

<div class="modal" id="adminModal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="adminTitle">后台入口</h2>
      <button class="mini" id="adminClose">关闭</button>
    </div>
    <div class="modal-body" id="adminBody"></div>
  </div>
</div>

<script src="app.js?v=6bdc41ac94"></script>

<!-- 大隐藏（UR）出场演出。平时 hidden，抽到了才去取视频 -->
<div class="ultra" id="ultra" hidden>
  <video class="ultra-video" id="ultraVideo" playsinline webkit-playsinline preload="none"></video>
  <div class="ultra-vig" id="ultraVig"></div>

  <div class="ultra-stage" id="ultraStage" hidden>
    <div class="ultra-halo"></div>
    <div class="ultra-rays"></div>
    <div class="ultra-white" id="ultraWhite"></div>
    <div class="ultra-shock"></div>
    <div class="ultra-card" id="ultraCard"></div>
    <div class="ultra-sparks" id="ultraSparks"></div>
  </div>

  <div class="ultra-tip" id="ultraTip">点击任意处跳过 »</div>
</div>
</body>
</html>
